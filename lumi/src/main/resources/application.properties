spring.application.name=lumi
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Phase 2: files larger than this threshold are sent to the PySpark splitter.
amex.ingestion.file-size-threshold-bytes=200
amex.ingestion.split-chunks=3
amex.ingestion.python-executable=python
amex.ingestion.splitter-script=../data_ingress/file_splitter.py
amex.ingestion.split-output-directory=../data_ingress/split_chunks

# Host path mounted into Airflow by docker-compose.yaml.
amex.ingestion.host-data-root=../data_ingress
amex.ingestion.airflow-data-root=/opt/airflow/data_ingress

# Airflow REST API.
amex.ingestion.airflow-url=http://localhost:8081/api/v1/dags/amex_employee_ingestion/dagRuns
amex.ingestion.airflow-username=airflow
amex.ingestion.airflow-password=airflow
