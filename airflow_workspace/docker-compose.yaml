version: "3.8"

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    LUMI_DB_HOST: ${LUMI_DB_HOST:-127.0.0.1}
    LUMI_DB_PORT: ${LUMI_DB_PORT:-3307}
    LUMI_DB_NAME: ${LUMI_DB_NAME:-capstone_lumi_dw}
    LUMI_DB_USERNAME: ${LUMI_DB_USERNAME:-lumi}
    LUMI_DB_PASSWORD: ${LUMI_DB_PASSWORD:-lumi_password}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../lumi/target/lumi-0.0.1-SNAPSHOT.jar:/opt/airflow/plugins/lumi-0.0.1-SNAPSHOT.jar:ro
    - ../data_ingress:/opt/airflow/data_ingress
  depends_on:
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-capstone_lumi_dw}
      MYSQL_USER: ${LUMI_DB_USERNAME:-lumi}
      MYSQL_PASSWORD: ${LUMI_DB_PASSWORD:-lumi_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-db-volume:/var/lib/mysql
      - ../data_ingress/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    user: "0:0"
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags
      - ../lumi/target/lumi-0.0.1-SNAPSHOT.jar:/opt/airflow/plugins/lumi-0.0.1-SNAPSHOT.jar:ro
      - ../data_ingress:/opt/airflow/data_ingress

volumes:
  postgres-db-volume:
  mysql-db-volume:
